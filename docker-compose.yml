services:
  proxy-vdo:
    build: .
    image: proxy-vdo:latest
    container_name: proxy-vdo
    restart: unless-stopped

    ports:
      # publish เฉพาะ localhost ของโฮสต์ — แอปไม่มี auth ห้าม expose ออกเน็ต
      - "127.0.0.1:8080:8080"

    volumes:
      # ไฟล์วิดีโอที่โหลด เก็บออกมาที่โฮสต์ (โฟลเดอร์ downloads/ ข้าง ๆ ไฟล์นี้)
      - ./downloads:/app/downloads
      # รายการหนัง (SQLite) — อัปเดตได้โดยไม่ต้อง rebuild image
      # mount "ไฟล์" ไม่ใช่โฟลเดอร์ เพราะ SQLite จะสร้าง movies.db-wal/-shm ข้าง ๆ
      # ใน /app ซึ่งเป็นของ appuser อยู่แล้ว จึงเขียนได้
      - ./movies.db:/app/movies.db

    # Chromium (Playwright) ต้องการ /dev/shm ใหญ่ ไม่งั้น renderer crash ตอนหา master
    shm_size: "1gb"

    # เก็บ zombie process ของ chromium (chromium spawn ลูกหลายตัว)
    init: true

    # เช็คว่าเซิร์ฟเวอร์ยังตอบอยู่
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/',timeout=5).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
